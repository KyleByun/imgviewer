[package]
name = "imgview"
version = "0.1.0"
edition = "2021"
description = "ACDSee 스타일의 간단한 이미지 뷰어"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "tiff",
    "webp",
    "tga",
    "pnm",
    "qoi",
    "hdr",
] }
dirs = "7.0.0"
trash = "5.4.0"
serde = { version = "1.0.229", features = ["derive"] }

# 앱에서 탐색기로 끌어서 복사 (Linux는 GTK 창이 필요해서 지원하지 않음)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"

# 시작할 때 화면 밖에 있던 창을 가운데로 옮기기 (모니터 목록/창 위치 조회)
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

# 디버그 빌드에서도 이미지 디코딩이 느려지지 않도록 의존성은 최적화해서 빌드
[profile.dev.package."*"]
opt-level = 3

# build.rs: assets/icons/imgview.ico → Windows exe 아이콘
[build-dependencies]
winresource = "0.1.34"
