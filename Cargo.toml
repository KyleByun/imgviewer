[package]
name = "imgview"
version = "0.1.0"
edition = "2021"
description = "ACDSee 스타일의 간단한 이미지 뷰어"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "tiff",
    "webp",
    "tga",
    "pnm",
    "qoi",
    "hdr",
] }
dirs = "7.0.0"
trash = "5.4.0"
serde = { version = "1.0.229", features = ["derive"] }
# macOS/Windows에서 만든 파일 이름(NFD)을 화면에 보여줄 때 자모가 분리되지 않도록 NFC로 합친다
unicode-normalization = "0.1"

# 앱에서 탐색기로 끌어서 복사 (Windows/macOS. Linux는 GTK 창이 필요해서 이 crate 대신 src/xdnd.rs를 쓴다)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"

# Linux: 끌어놓기를 쓰려고 X11(Wayland 세션에서는 XWayland)로 실행한다.
#   winit은 Wayland에서 끌어놓기를 받지 못하고, 앱 밖으로 끌기(XDND 보내는 쪽)는 x11rb로 직접 구현 (src/xdnd.rs)
#   끄는 동안 커서 모양은 커서 테마(Xcursor)에서 불러와 앱 창에 씌운다 (창 번호는 raw-window-handle로 얻음)
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = { version = "0.13", features = ["cursor", "resource_manager"] }
raw-window-handle = "0.6"

# macOS: Finder에서 연 파일(문서 열기 이벤트)을 받는다 (src/assoc.rs). winit이 쓰는 것과 같은 버전
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

# 시작할 때 화면 밖에 있던 창을 가운데로 옮기기 (모니터 목록/창 위치 조회)
# 파일 확장자 연결: 레지스트리(Registry)에 등록하고 기본 앱 설정 화면 열기(Shell)
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 디버그 빌드에서도 이미지 디코딩이 느려지지 않도록 의존성은 최적화해서 빌드
[profile.dev.package."*"]
opt-level = 3

# build.rs: assets/icons/imgview.ico → Windows exe 아이콘
[build-dependencies]
winresource = "0.1.34"
